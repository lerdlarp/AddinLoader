name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/AddinLoader.Tests -c Release

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: [2020, 2021, 2022, 2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/AddinLoader/AddinLoader.csproj -c Release -p:RevitVersion=${{ matrix.revit }}
      - run: dotnet build samples/SampleAddin/SampleAddin.csproj -c Release -p:RevitVersion=${{ matrix.revit }}
      - uses: actions/upload-artifact@v4
        with:
          name: AddinLoader-Revit${{ matrix.revit }}
          path: src/AddinLoader/bin/Release/${{ matrix.revit }}/
